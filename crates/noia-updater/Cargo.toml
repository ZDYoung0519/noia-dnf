[package]
name = "noia-updater"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
