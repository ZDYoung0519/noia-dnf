[workspace]
members = ["crates/noia-updater"]
resolver = "3"

[package]
name = "noia-dnf"
version = "0.1.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rust-i18n = "4.2.4"
async-channel = "2"
gpui-kit = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }

[target."cfg(windows)".dependencies]
noia-updater = { path = "crates/noia-updater" }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dev-dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_Ime"] }
